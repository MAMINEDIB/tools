# =====================================================
# PMT Backend - Application Configuration
# Les valeurs sensibles sont dans le fichier .env
# =====================================================

# Application
spring.application.name=pmt-backend
server.port=8080

# Database Configuration - PostgreSQL
# Utilise les variables d'environnement pour la sécurité
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pmt_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pmt_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pmt_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging
logging.level.root=INFO
logging.level.com.codesolutions.pmt=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Email Configuration - Mailjet SMTP
# Utilise les variables d'environnement pour la sécurité
spring.mail.host=${SPRING_MAIL_HOST:in-v3.mailjet.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mailjet sender email (depuis variable d'environnement)
mail.from=${EMAIL_FROM:aminedibsn@gmail.com}

# CORS Configuration (for Angular frontend)
cors.allowed.origins=http://localhost:4200,http://localhost:80

# File Upload (if needed later)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
