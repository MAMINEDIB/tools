name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build et test backend
  backend-build-test:
    name: Backend - Build et Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configurer JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build avec Maven
      working-directory: ./pmt-backend
      run: ./mvnw clean package -DskipTests
      
    - name: Exécuter les tests
      working-directory: ./pmt-backend
      run: ./mvnw test
      
    - name: Générer le rapport de couverture
      working-directory: ./pmt-backend
      run: ./mvnw jacoco:report
      
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-jar
        path: pmt-backend/target/*.jar

  # Job 2: Build et test frontend
  frontend-build-test:
    name: Frontend - Build et Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: pmt-frontend/package-lock.json
        
    - name: Installer les dépendances
      working-directory: ./pmt-frontend
      run: npm ci
      
    - name: Exécuter les tests Jest
      working-directory: ./pmt-frontend
      run: npm run test -- --coverage
      
    - name: Build production
      working-directory: ./pmt-frontend
      run: npm run build --prod

  # Job 3: Build et push images Docker
  docker-build-push:
    name: Docker - Build & Push
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Login vers Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build et push Backend image
      working-directory: ./pmt-backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/pmt-backend:latest .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/pmt-backend:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/pmt-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/pmt-backend:${{ github.sha }}
        
    - name: Build et push Frontend image
      working-directory: ./pmt-frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/pmt-frontend:latest .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/pmt-frontend:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/pmt-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/pmt-frontend:${{ github.sha }}

  # Job 4: Notification de succès
  notify-success:
    name: Notification de succès
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Envoyer notification
      run: echo "✅ Pipeline CI/CD terminé avec succès !"
